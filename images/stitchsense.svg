<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="StitchSense: sensing from a smart garment as the source domain, transferred to a smartwatch for activity recognition">
  <rect width="640" height="300" fill="#F4F6F7"/>
  <!-- garment -->
  <g transform="translate(70 18)">
    <path d="M60 10 L100 0 Q120 22 140 0 L180 10 L230 60 L200 92 L180 76 L180 220 L60 220 L60 76 L40 92 L10 60 Z" fill="#DCE9EE" stroke="#2C5D73" stroke-width="3" stroke-linejoin="round"/>
    <!-- stitched sensor seams -->
    <path d="M100 0 Q120 22 140 0" fill="none" stroke="#E07A2E" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M60 76 L60 220" fill="none" stroke="#E07A2E" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M180 76 L180 220" fill="none" stroke="#E07A2E" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M18 64 L50 34" fill="none" stroke="#E07A2E" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M222 64 L190 34" fill="none" stroke="#E07A2E" stroke-width="3" stroke-dasharray="6 5"/>
    <circle cx="120" cy="120" r="9" fill="#E07A2E"/>
    <circle cx="86" cy="170" r="7" fill="#E07A2E"/>
    <circle cx="154" cy="170" r="7" fill="#E07A2E"/>
    <text x="120" y="248" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#2C5D73">smart garment</text>
    <text x="120" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5A6B76">source domain</text>
  </g>
  <!-- transfer arrow -->
  <g>
    <path d="M330 150 L420 150" stroke="#52ADC8" stroke-width="4" stroke-linecap="round"/>
    <path d="M412 140 L426 150 L412 160" fill="none" stroke="#52ADC8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="376" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5A6B76">transfer</text>
  </g>
  <!-- watch -->
  <g transform="translate(470 56)">
    <rect x="22" y="0" width="56" height="34" rx="8" fill="#2C5D73"/>
    <rect x="22" y="126" width="56" height="34" rx="8" fill="#2C5D73"/>
    <rect x="6" y="26" width="88" height="108" rx="22" fill="#13232E"/>
    <rect x="14" y="34" width="72" height="92" rx="16" fill="#1E3A48"/>
    <path d="M22 84 L34 84 L40 66 L48 102 L56 76 L62 84 L78 84" fill="none" stroke="#52ADC8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="50" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#2C5D73">smartwatch</text>
    <text x="50" y="208" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5A6B76">activity recognition</text>
  </g>
</svg>
